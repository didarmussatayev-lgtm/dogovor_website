<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Согласие на медицинские процедуры</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <div class="container">
    <h1>Согласие на медицинские процедуры</h1>

    <form id="consentForm" novalidate>
      <div class="form-group">
        <label for="fio">ФИО <span>*</span></label>
        <input type="text" id="fio" />
        <div id="fio-error" class="error-text"></div>
      </div>

      <div class="form-group">
        <label for="birthdate">Дата рождения (дд/мм/гггг) <span>*</span></label>
        <input type="text" id="birthdate" maxlength="10" placeholder="дд/мм/гггг" />
        <div id="birthdate-error" class="error-text"></div>
      </div>

      <div class="form-group">
        <label for="gender">Пол <span>*</span></label>
        <select id="gender">
          <option value="">Выберите</option>
          <option value="Мужской">Мужской</option>
          <option value="Женский">Женский</option>
        </select>
        <div id="gender-error" class="error-text"></div>
      </div>

      <div class="form-group">
        <label for="iin">ИИН <span>*</span></label>
        <input type="text" id="iin" maxlength="12" />
        <div id="iin-error" class="error-text"></div>
      </div>

      <div class="form-group">
        <label for="phone">Телефон <span>*</span></label>
        <input type="text" id="phone" placeholder="+7XXXXXXXXXX или 8XXXXXXXXXX" />
        <div id="phone-error" class="error-text"></div>
      </div>

      <div class="form-group">
        <label for="allergy">Аллергия / непереносимость (если нет, напишите НЕТ) <span>*</span></label>
        <textarea id="allergy" rows="3"></textarea>
        <div id="allergy-error" class="error-text"></div>
      </div>

      <div class="form-group">
        <label for="procedures">Какие процедуры нельзя выполнять (если нет, напишите НЕТ) <span>*</span></label>
        <textarea id="procedures" rows="3"></textarea>
        <div id="procedures-error" class="error-text"></div>
      </div>

      <div class="form-group">
        <label>Прикрепите вашу подпись <span>*</span></label>
        <p class="hint">Нажмите, чтобы создать цифровую подпись</p>
        <canvas id="signatureCanvas"></canvas>
        <div id="signature-error" class="error-text"></div>
        <div id="signature-status" class="signature-status"></div>

 
                <!-- Submit Button -->
                <button type="submit" class="btn-submit" id="submitBtn">Скачать соглашение</button>
            </form>
 main
        </div>
      </div>

      <button type="submit" class="btn-submit">ЗАВЕРШИТЬ</button>
    </form>
  </div>

  <!-- Модальное окно загрузки -->
  <div id="downloadModal" class="download-modal" style="display:none;">
    <div class="download-modal__card">
      <div class="download-spinner"></div>
      <h3>Формируем соглашение</h3>
      <p>Обычно это занимает меньше 1 минуты...</p>
    </div>
  </div>

  <script src="script.js?v=10"></script>
</body>
</html>
